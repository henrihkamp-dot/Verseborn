name: Package Shadow Trials III artwork

on:
  push:
    branches:
      - tools/package-shadow-trials-iii-artwork
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package runtime artwork
        run: |
          cd public/game/shadow-court-iii
          zip -r shadow-trials-iii-artwork.zip assets
      - name: Upload artwork archive
        uses: actions/upload-artifact@v4
        with:
          name: shadow-trials-iii-artwork
          path: public/game/shadow-court-iii/shadow-trials-iii-artwork.zip
          if-no-files-found: error
          retention-days: 7
